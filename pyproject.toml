[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "cppperflab"
version = "0.1.0"
description = "Agent-native C++ performance experiments with preserved evidence"
requires-python = ">=3.11"
license = {text = "MIT"}
readme = "README.md"
dependencies = []

[project.scripts]
perflab = "cppperflab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cppperflab = ["schemas/*.json"]
